# Nginx 설정 파일
# /etc/nginx/sites-available/memojjang

upstream memojjang_server {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    client_max_body_size 4G;
    
    # 액세스 로그
    access_log /var/log/nginx/memojjang-access.log;
    error_log /var/log/nginx/memojjang-error.log;
    
    # 정적 파일 설정
    location /static/ {
        alias /path/to/vibecoding_Django/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 미디어 파일 설정 (필요시 활성화)
    # location /media/ {
    #     alias /path/to/vibecoding_Django/media/;
    #     expires 30d;
    # }
    
    # Django 애플리케이션
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering off;
        
        proxy_pass http://memojjang_server;
    }
    
    # 에러 페이지
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /path/to/vibecoding_Django/templates/;
    }
}

